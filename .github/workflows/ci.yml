name: Verificar cambios de La Comarca
on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias del panel
        run: npm ci --prefix api
      - name: Verificar sintaxis, pruebas y build
        env:
          BASE_PATH: /
          PLATFORM_ORIGIN: https://comarca.kipadmon.com
        run: npm run check
      - name: Verificar build raíz de GitHub Pages
        env:
          BASE_PATH: /
          PLATFORM_ORIGIN: https://comarca.kipadmon.com
        run: npm run build
