name: Verificar y desplegar Worker de La Comarca
on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/worker.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: Desplegar el Worker después de pasar las verificaciones
        required: true
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias del Worker
        run: npm ci --prefix api
      - name: Verificar código y pruebas
        env:
          BASE_PATH: /
          PLATFORM_ORIGIN: https://comarca.kipadmon.com
          REGISTRATION_API: ${{ vars.REGISTRATION_API }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          ONESIGNAL_APP_ID: ${{ vars.ONESIGNAL_APP_ID }}
        run: npm run check
      - name: Verificar configuración Wrangler
        working-directory: api
        run: npx wrangler deploy --dry-run
      - name: Desplegar Worker
        if: github.event_name == 'push' || inputs.deploy == true
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 migrations apply la-comarca-cms --remote
          npx wrangler deploy --keep-vars
